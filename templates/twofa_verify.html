<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Identity - Nexus ERP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #05070a;
            --card-bg: rgba(15, 23, 42, 0.6);
            --card-border: rgba(255, 255, 255, 0.04);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-blue: #3b82f6;
            --accent-purple: #8b5cf6;
        }
        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            background-image:
                radial-gradient(circle at 80% 30%, rgba(59, 130, 246, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 20% 70%, rgba(139, 92, 246, 0.15) 0%, transparent 50%);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .auth-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 40px;
            backdrop-filter: blur(20px);
            width: 100%;
            max-width: 450px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: fadeSlideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .brand-icon {
            width: 60px; height: 60px;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            border-radius: 16px;
            display: flex; align-items: center; justify-content: center;
            font-size: 30px; color: white;
            box-shadow: 0 0 30px rgba(59, 130, 246, 0.4);
            margin: 0 auto 20px;
        }
        .auth-title {
            text-align: center; font-size: 28px; font-weight: 800;
            margin-bottom: 5px;
            background: linear-gradient(to right, #fff, #94a3b8);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .auth-subtitle {
            text-align: center; color: var(--text-secondary);
            font-size: 15px; margin-bottom: 30px;
        }
        .form-control {
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white; padding: 14px 18px; border-radius: 12px;
            font-size: 15px; transition: all 0.3s;
        }
        .form-control:focus {
            background: rgba(15, 23, 42, 0.8);
            border-color: var(--accent-blue); color: white;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
        }
        .form-label { color: var(--text-secondary); font-weight: 500; font-size: 14px; }
        .btn-glow {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            border: none; color: white; padding: 14px;
            border-radius: 12px; font-weight: 600; font-size: 16px;
            width: 100%; margin-top: 10px;
            box-shadow: 0 5px 20px rgba(59, 130, 246, 0.4); transition: 0.3s;
        }
        .btn-glow:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(59, 130, 246, 0.6); color: white;
        }
        .auth-footer { text-align: center; margin-top: 25px; color: var(--text-secondary); font-size: 14px; }
        .auth-footer a { color: var(--accent-blue); text-decoration: none; font-weight: 600; }
        @keyframes fadeSlideUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="auth-card">
        <div class="brand-icon">
            <i class="bi bi-shield-lock-fill"></i>
        </div>
        <h1 class="auth-title">Verification Required</h1>
        <p class="auth-subtitle">Enter the 6-digit code from your authenticator app</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
            <div class="alert alert-{{ category }} bg-dark text-white border-{{ category }}" role="alert" style="border-radius: 12px;">
                <i class="bi bi-info-circle-fill me-2 text-{{ category }}"></i> {{ message }}
            </div>
            {% endfor %}
        {% endif %}
        {% endwith %}

        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            <div class="mb-4">
                <label class="form-label">Authenticator Code</label>
                <input type="text" class="form-control" name="totp_code" placeholder="000000"
                       maxlength="6" pattern="[0-9]{6}" inputmode="numeric" autocomplete="one-time-code" required
                       autofocus
                       style="text-align: center; font-size: 32px; letter-spacing: 10px; padding: 18px;">
            </div>
            <button type="submit" class="btn btn-glow">
                <i class="bi bi-box-arrow-in-right me-2"></i>Verify & Continue
            </button>
        </form>

        <div class="auth-footer">
            <a href="/login"><i class="bi bi-arrow-left me-1"></i> Back to Login</a>
        </div>
    </div>
</body>
</html>
