<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Nexus ERP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #05070a;
            --card-bg: rgba(15, 23, 42, 0.6);
            --card-border: rgba(255, 255, 255, 0.04);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-blue: #3b82f6;
            --accent-purple: #8b5cf6;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 80% 30%, rgba(59, 130, 246, 0.12) 0%, transparent 50%),
                radial-gradient(circle at 20% 70%, rgba(139, 92, 246, 0.12) 0%, transparent 50%);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .auth-bg {
            position: fixed;
            inset: 0;
            overflow: hidden;
            z-index: 0;
        }

        .auth-bg-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            animation: float 20s ease-in-out infinite;
        }

        .auth-bg-orb:nth-child(1) {
            width: 400px;
            height: 400px;
            background: rgba(59, 130, 246, 0.15);
            top: -100px;
            right: -100px;
            animation-delay: 0s;
        }

        .auth-bg-orb:nth-child(2) {
            width: 350px;
            height: 350px;
            background: rgba(139, 92, 246, 0.12);
            bottom: -80px;
            left: -80px;
            animation-delay: -7s;
        }

        .auth-bg-orb:nth-child(3) {
            width: 250px;
            height: 250px;
            background: rgba(20, 184, 166, 0.08);
            top: 50%;
            left: 50%;
            animation-delay: -14s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -30px) scale(1.05); }
            66% { transform: translate(-20px, 20px) scale(0.95); }
        }

        .auth-card {
            background: rgba(12, 19, 34, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 28px;
            padding: 48px 40px;
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            width: 100%;
            max-width: 440px;
            box-shadow: 0 25px 60px -12px rgba(0, 0, 0, 0.6);
            animation: fadeSlideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            z-index: 1;
        }

        .auth-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.08), transparent);
            border-radius: 28px 28px 0 0;
        }

        .brand-icon {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: white;
            box-shadow: 0 0 28px rgba(59, 130, 246, 0.35);
            margin: 0 auto 24px;
            transition: transform 0.3s ease;
        }

        .brand-icon:hover {
            transform: rotate(-5deg) scale(1.05);
        }

        .auth-title {
            text-align: center;
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 6px;
            background: linear-gradient(135deg, #fff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.3px;
        }

        .auth-subtitle {
            text-align: center;
            color: var(--text-secondary);
            font-size: 15px;
            margin-bottom: 32px;
        }

        .form-control {
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: white;
            padding: 14px 18px;
            border-radius: 14px;
            font-size: 15px;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .form-control:focus {
            background: rgba(15, 23, 42, 0.7);
            border-color: var(--accent-blue);
            color: white;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.12);
        }

        .form-control::placeholder {
            color: #475569;
        }

        .form-label {
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .input-group-text {
            background: rgba(15, 23, 42, 0.5) !important;
            border: 1px solid rgba(255, 255, 255, 0.08) !important;
            color: var(--text-secondary) !important;
        }

        .btn-glow {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            border: none;
            color: white;
            padding: 14px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 15px;
            width: 100%;
            margin-top: 12px;
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.35);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
        }

        .btn-glow::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.15), transparent);
            transition: left 0.5s;
        }

        .btn-glow:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 28px rgba(59, 130, 246, 0.45);
            color: white;
        }

        .btn-glow:hover::before {
            left: 100%;
        }

        .btn-glow:active {
            transform: translateY(0);
        }

        .auth-footer {
            text-align: center;
            margin-top: 28px;
            color: var(--text-secondary);
            font-size: 14px;
        }

        .auth-footer a {
            color: var(--accent-blue);
            text-decoration: none;
            font-weight: 600;
            transition: 0.3s;
        }

        .auth-footer a:hover {
            color: #60a5fa;
            text-decoration: underline;
        }

        .form-check-input:checked {
            background-color: var(--accent-blue);
            border-color: var(--accent-blue);
        }

        @keyframes fadeSlideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 480px) {
            .auth-card { padding: 36px 24px; margin: 16px; }
        }
    </style>
</head>

<body>
    <div class="auth-bg">
        <div class="auth-bg-orb"></div>
        <div class="auth-bg-orb"></div>
        <div class="auth-bg-orb"></div>
    </div>

    <div class="auth-card">
        <div class="brand-icon">
            <i class="bi bi-building-fill"></i>
        </div>
        <h1 class="auth-title">Welcome Back</h1>
        <p class="auth-subtitle">Sign in to the Nexus ERP Platform</p>

        <!-- Flash Messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
            <div class="alert alert-{{ category }} bg-dark text-white border-{{ category }}" role="alert" style="border-radius: 12px;">
                <i class="bi bi-info-circle-fill me-2 text-{{ category }}"></i> {{ message }}
            </div>
            {% endfor %}
        {% endif %}
        {% endwith %}

        <form action="{{ url_for('auth.login') }}" method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            <div class="mb-4">
                <label class="form-label">Email Address</label>
                <div class="input-group">
                    <span class="input-group-text" style="border-right: none; border-radius: 14px 0 0 14px;">
                        <i class="bi bi-envelope"></i>
                    </span>
                    <input type="email" class="form-control" name="email" placeholder="name@company.com" style="border-left: none; border-radius: 0 14px 14px 0;" required>
                </div>
            </div>

            <div class="mb-4">
                <div class="d-flex justify-content-between align-items-center">
                    <label class="form-label mb-0">Password</label>
                    <a href="{{ url_for('auth.forgot_password') }}" style="font-size: 13px; color: var(--accent-blue); text-decoration: none; font-weight: 500;">Forgot password?</a>
                </div>
                <div class="input-group mt-2">
                    <span class="input-group-text" style="border-right: none; border-radius: 14px 0 0 14px;">
                        <i class="bi bi-lock"></i>
                    </span>
                    <input type="password" class="form-control" name="password" placeholder="Enter your password" style="border-left: none; border-radius: 0 14px 14px 0;" required>
                </div>
            </div>

            <div class="mb-4 form-check">
                <input type="checkbox" class="form-check-input" id="remember">
                <label class="form-check-label text-secondary" for="remember" style="font-size: 14px;">Remember this device</label>
            </div>

            <button type="submit" class="btn btn-glow">Sign In <i class="bi bi-box-arrow-in-right ms-2"></i></button>
        </form>

        <div class="auth-footer">
            Don't have an account? <a href="{{ url_for('auth.register') }}">Register Now</a>
        </div>
    </div>
</body>
</html>
