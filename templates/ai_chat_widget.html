<!-- AI Chat Widget - Include in any page -->
<style>
    .ai-chat-fab {
        position: fixed;
        bottom: 30px;
        right: 30px;
        width: 60px;
        height: 60px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
        border: none;
        color: white;
        font-size: 24px;
        cursor: pointer;
        box-shadow: 0 8px 30px rgba(59, 130, 246, 0.4);
        z-index: 1100;
        transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .ai-chat-fab:hover {
        transform: scale(1.1) translateY(-3px);
        box-shadow: 0 12px 40px rgba(59, 130, 246, 0.6);
    }
    .ai-chat-fab .pulse-ring {
        position: absolute;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        border: 2px solid rgba(59, 130, 246, 0.4);
        animation: aiPulse 2s infinite;
    }
    @keyframes aiPulse {
        0% { transform: scale(1); opacity: 1; }
        100% { transform: scale(1.5); opacity: 0; }
    }

    .ai-chat-panel {
        position: fixed;
        bottom: 100px;
        right: 30px;
        width: 400px;
        height: 550px;
        background: var(--sidebar-bg);
        border: 1px solid var(--card-border);
        border-radius: 24px;
        z-index: 1100;
        display: none;
        flex-direction: column;
        overflow: hidden;
        box-shadow: 0 25px 60px rgba(0,0,0,0.5);
        backdrop-filter: blur(20px);
        animation: chatSlideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .ai-chat-panel.open { display: flex; }
    @keyframes chatSlideUp {
        from { opacity: 0; transform: translateY(20px) scale(0.95); }
        to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .ai-chat-header {
        padding: 18px 20px;
        background: linear-gradient(135deg, rgba(59,130,246,0.15), rgba(139,92,246,0.15));
        border-bottom: 1px solid var(--card-border);
        display: flex;
        align-items: center;
        justify-content: space-between;
    }
    .ai-chat-header .ai-title {
        display: flex;
        align-items: center;
        gap: 10px;
    }
    .ai-chat-header .ai-title .ai-dot {
        width: 10px; height: 10px;
        background: #10b981;
        border-radius: 50%;
        box-shadow: 0 0 10px rgba(16,185,129,0.5);
        animation: aiDotPulse 2s infinite;
    }
    @keyframes aiDotPulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
    }
    .ai-chat-header h6 { margin: 0; font-weight: 700; color: white; font-size: 15px; }
    .ai-chat-header .ai-badge {
        font-size: 10px;
        background: rgba(16,185,129,0.15);
        color: #10b981;
        padding: 3px 8px;
        border-radius: 20px;
        font-weight: 600;
    }
    .ai-close-btn {
        background: none;
        border: none;
        color: #94a3b8;
        font-size: 18px;
        cursor: pointer;
        padding: 4px;
        transition: 0.2s;
    }
    .ai-close-btn:hover { color: white; }

    .ai-chat-messages {
        flex: 1;
        overflow-y: auto;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        scrollbar-width: thin;
        scrollbar-color: rgba(255,255,255,0.1) transparent;
    }
    .ai-msg {
        max-width: 85%;
        padding: 12px 16px;
        border-radius: 18px;
        font-size: 13.5px;
        line-height: 1.5;
        word-wrap: break-word;
    }
    .ai-msg.user {
        align-self: flex-end;
        background: linear-gradient(135deg, #3b82f6, #6366f1);
        color: white;
        border-bottom-right-radius: 6px;
    }
    .ai-msg.bot {
        align-self: flex-start;
        background: rgba(255,255,255,0.06);
        color: #e2e8f0;
        border-bottom-left-radius: 6px;
        border: 1px solid rgba(255,255,255,0.06);
    }
    .ai-msg.bot .ai-msg-label {
        font-size: 10px;
        color: #3b82f6;
        font-weight: 700;
        margin-bottom: 4px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }
    .ai-typing {
        display: flex;
        gap: 5px;
        padding: 12px 16px;
        align-self: flex-start;
    }
    .ai-typing span {
        width: 7px; height: 7px;
        background: #3b82f6;
        border-radius: 50%;
        animation: aiTyping 1.4s infinite;
    }
    .ai-typing span:nth-child(2) { animation-delay: 0.2s; }
    .ai-typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes aiTyping {
        0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
        30% { transform: translateY(-8px); opacity: 1; }
    }

    .ai-chat-input-area {
        padding: 14px 16px;
        border-top: 1px solid var(--card-border);
        display: flex;
        gap: 10px;
        background: rgba(10,15,25,0.8);
    }
    .ai-chat-input-area input {
        flex: 1;
        background: rgba(255,255,255,0.05);
        border: 1px solid var(--card-border);
        border-radius: 14px;
        padding: 12px 16px;
        color: white;
        font-size: 13.5px;
        outline: none;
        transition: 0.2s;
    }
    .ai-chat-input-area input:focus {
        border-color: rgba(59,130,246,0.4);
        box-shadow: 0 0 0 3px rgba(59,130,246,0.1);
    }
    .ai-chat-input-area input::placeholder { color: #475569; }
    .ai-send-btn {
        width: 44px;
        height: 44px;
        border-radius: 14px;
        background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
        border: none;
        color: white;
        font-size: 16px;
        cursor: pointer;
        transition: 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .ai-send-btn:hover { transform: scale(1.05); }
    .ai-send-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .ai-quick-actions {
        display: flex;
        gap: 6px;
        padding: 0 16px 10px;
        flex-wrap: wrap;
    }
    .ai-quick-btn {
        font-size: 11px;
        padding: 5px 10px;
        border-radius: 10px;
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(255,255,255,0.06);
        color: #94a3b8;
        cursor: pointer;
        transition: 0.2s;
        white-space: nowrap;
    }
    .ai-quick-btn:hover {
        background: rgba(59,130,246,0.1);
        border-color: rgba(59,130,246,0.3);
        color: #3b82f6;
    }

    @media (max-width: 480px) {
        .ai-chat-panel {
            width: calc(100vw - 20px);
            right: 10px;
            bottom: 80px;
            height: 70vh;
        }
        .ai-chat-fab {
            bottom: 20px;
            right: 20px;
            width: 52px;
            height: 52px;
            font-size: 20px;
        }
    }
</style>

<button class="ai-chat-fab" id="aiChatFab" title="Nexus AI Assistant" aria-label="Open AI Assistant">
    <div class="pulse-ring"></div>
    <i class="bi bi-robot"></i>
</button>

<div class="ai-chat-panel" id="aiChatPanel">
    <div class="ai-chat-header">
        <div class="ai-title">
            <div class="ai-dot"></div>
            <div>
                <h6>Nexus AI</h6>
                <span class="ai-badge">GEMINI POWERED</span>
            </div>
        </div>
        <button class="ai-close-btn" id="aiChatClose"><i class="bi bi-x-lg"></i></button>
    </div>

    <div class="ai-chat-messages" id="aiChatMessages">
        <div class="ai-msg bot">
            <div class="ai-msg-label">Nexus AI</div>
            Hello! I'm your AI business assistant. Ask me anything about your sales, inventory, expenses, or employees.
        </div>
    </div>

    <div class="ai-quick-actions">
        <button class="ai-quick-btn" data-msg="What's my total revenue this month?">Revenue</button>
        <button class="ai-quick-btn" data-msg="Show low stock products">Low Stock</button>
        <button class="ai-quick-btn" data-msg="Summarize today's expenses">Expenses</button>
        <button class="ai-quick-btn" data-msg="How many employees are active?">Employees</button>
        <button class="ai-quick-btn" data-msg="Any anomalies in my data?">Anomalies</button>
    </div>

    <div class="ai-chat-input-area">
        <input type="text" id="aiChatInput" placeholder="Ask about your business..." autocomplete="off">
        <button class="ai-send-btn" id="aiChatSend"><i class="bi bi-send-fill"></i></button>
    </div>
</div>

<script>
(function() {
    const fab = document.getElementById('aiChatFab');
    const panel = document.getElementById('aiChatPanel');
    const closeBtn = document.getElementById('aiChatClose');
    const input = document.getElementById('aiChatInput');
    const sendBtn = document.getElementById('aiChatSend');
    const messages = document.getElementById('aiChatMessages');

    fab.addEventListener('click', () => {
        panel.classList.toggle('open');
        if (panel.classList.contains('open')) input.focus();
    });
    closeBtn.addEventListener('click', () => panel.classList.remove('open'));

    function addMessage(text, isUser) {
        const div = document.createElement('div');
        div.className = 'ai-msg ' + (isUser ? 'user' : 'bot');
        if (!isUser) div.innerHTML = '<div class="ai-msg-label">Nexus AI</div>';
        div.appendChild(document.createTextNode(text));
        messages.appendChild(div);
        messages.scrollTop = messages.scrollHeight;
    }

    function showTyping() {
        const div = document.createElement('div');
        div.className = 'ai-typing';
        div.id = 'aiTyping';
        div.innerHTML = '<span></span><span></span><span></span>';
        messages.appendChild(div);
        messages.scrollTop = messages.scrollHeight;
    }

    function hideTyping() {
        const t = document.getElementById('aiTyping');
        if (t) t.remove();
    }

    async function sendMessage(text) {
        if (!text.trim()) return;
        addMessage(text, true);
        input.value = '';
        sendBtn.disabled = true;
        showTyping();

        try {
            const res = await fetch('/api/ai/chat', {
                method: 'POST',
                headers: {'Content-Type': 'application/json', 'X-CSRFToken': document.querySelector('meta[name=csrf-token]').content},
                body: JSON.stringify({message: text})
            });
            const data = await res.json();
            hideTyping();
            addMessage(data.response || 'No response received.', false);
        } catch(e) {
            hideTyping();
            addMessage('Connection error. Please try again.', false);
        }
        sendBtn.disabled = false;
        input.focus();
    }

    sendBtn.addEventListener('click', () => sendMessage(input.value));
    input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage(input.value);
        }
    });

    document.querySelectorAll('.ai-quick-btn').forEach(btn => {
        btn.addEventListener('click', () => sendMessage(btn.dataset.msg));
    });
})();
</script>
