<!-- Global Search Component -->
<div class="search-container position-relative">
    <div class="input-group search-input-group">
        <span class="input-group-text bg-transparent border-secondary text-secondary">
            <i class="bi bi-search"></i>
        </span>
        <input type="text" id="globalSearchInput" class="form-control bg-transparent border-secondary text-white" 
               placeholder="Search anything... (Ctrl+K)">
    </div>
    
    <!-- Search Results Dropdown -->
    <div id="globalSearchResults" class="dropdown-menu w-100 mt-2 p-0 shadow-lg border-0 search-dropdown">
        <div id="searchResultsList" class="search-dropdown-content">
            <!-- Results will be injected here -->
        </div>
    </div>
</div>

<style>
    .search-result-item i {
        font-size: 16px;
        width: 32px;
        height: 32px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 8px;
        flex-shrink: 0;
    }
    .res-employee { color: #3b82f6; background: rgba(59, 130, 246, 0.1); }
    .res-product { color: #10b981; background: rgba(16, 185, 129, 0.1); }
    .res-task { color: #8b5cf6; background: rgba(139, 92, 246, 0.1); }
</style>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const input = document.getElementById('globalSearchInput');
        const results = document.getElementById('globalSearchResults');
        const list = document.getElementById('searchResultsList');

        if (!input) return;

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        window.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && (e.key.toLowerCase() === 'k')) {
                e.preventDefault();
                input.focus();
            }
        });

        input.addEventListener('input', async (e) => {
            const query = e.target.value.trim();
            if (query.length < 2) {
                results.style.display = 'none';
                return;
            }

            try {
                const response = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
                const data = await response.json();

                if (data && data.length > 0) {
                    list.innerHTML = data.map(item => {
                        const safeTitle = escapeHtml(item.title);
                        const safeSubtitle = escapeHtml(item.subtitle || '');
                        const safeType = escapeHtml(item.type);
                        const iconClass = item.type === 'employee' ? 'bi-person res-employee' : item.type === 'product' ? 'bi-box res-product' : 'bi-check2-circle res-task';
                        const href = item.type === 'employee' ? 'employee' : item.type === 'product' ? 'inventory' : 'projects';
                        return `
                            <a href="/${href}?q=${encodeURIComponent(item.title)}" class="search-result-item">
                                <i class="bi ${iconClass}"></i>
                                <div>
                                    <div style="font-weight: 600; font-size: 14px;">${safeTitle}</div>
                                    <div style="font-size: 11px; opacity: 0.6;">${safeType.toUpperCase()} • ${safeSubtitle}</div>
                                </div>
                            </a>
                        `;
                    }).join('');
                    results.style.display = 'block';
                } else {
                    list.innerHTML = '<div class="p-4 text-center text-secondary small">No results found</div>';
                    results.style.display = 'block';
                }
            } catch (err) {
                console.error('Search error:', err);
            }
        });

        document.addEventListener('click', (e) => {
            if (!input.contains(e.target) && !results.contains(e.target)) {
                results.style.display = 'none';
            }
        });
    });
</script>
