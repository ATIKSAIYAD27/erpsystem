<!-- Nexus AI Floating Chat Widget -->
<div id="ai-chat-wrapper" style="position: fixed; bottom: 30px; right: 30px; z-index: 9999; font-family: 'Outfit', sans-serif;">
    <!-- Chat Button -->
    <button id="ai-toggle-btn" style="width: 60px; height: 60px; border-radius: 50%; background: linear-gradient(135deg, #8b5cf6, #3b82f6); border: none; color: white; font-size: 24px; box-shadow: 0 10px 25px rgba(139, 92, 246, 0.5); cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center;">
        <i class="bi bi-robot"></i>
    </button>

    <!-- Chat Window -->
    <div id="ai-chat-window" style="display: none; width: 400px; height: 550px; background: rgba(10, 15, 25, 0.95); backdrop-filter: blur(30px); border: 1px solid rgba(255,255,255,0.1); border-radius: 24px; position: absolute; bottom: 80px; right: 0; flex-direction: column; box-shadow: 0 20px 50px rgba(0,0,0,0.8); overflow: hidden; animation: slideUp 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);">
        <!-- Header -->
        <div style="padding: 20px; background: rgba(255,255,255,0.03); border-bottom: 1px solid rgba(255,255,255,0.08); display: flex; justify-content: space-between; align-items: center;">
            <div style="display: flex; align-items: center; gap: 12px;">
                <div style="position: relative;">
                    <div style="width: 40px; height: 40px; border-radius: 12px; background: linear-gradient(45deg, #8b5cf6, #3b82f6); display: flex; align-items: center; justify-content: center; color: white;">
                        <i class="bi bi-cpu-fill"></i>
                    </div>
                    <div style="position: absolute; bottom: -2px; right: -2px; width: 12px; height: 12px; border-radius: 50%; background: #10b981; border: 2px solid #0a0f19;"></div>
                </div>
                <div>
                    <h6 style="margin: 0; color: white; font-weight: 700; font-size: 15px;">Nexus Deep-Mind</h6>
                    <div style="font-size: 10px; color: #10b981; font-weight: 600; text-transform: uppercase; letter-spacing: 1px;">Online • Gemini 1.5</div>
                </div>
            </div>
            <button id="ai-close-btn" style="background: rgba(255,255,255,0.05); border: none; color: #94a3b8; width: 30px; height: 30px; border-radius: 8px; cursor: pointer; transition: 0.2s;"><i class="bi bi-x-lg"></i></button>
        </div>

        <!-- Chat Area -->
        <div id="ai-messages" style="flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; scroll-behavior: smooth;">
            <div class="ai-msg-bubble">
                Hello! I am your <b>Nexus Executive Strategist</b>. I have real-time access to your ERP data. 
                <br><br>
                How can I help you grow your business today?
            </div>
        </div>

        <!-- Input Area -->
        <div style="padding: 20px; background: rgba(0,0,0,0.3); border-top: 1px solid rgba(255,255,255,0.08);">
            <div style="display: flex; gap: 10px; background: rgba(255,255,255,0.05); padding: 5px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.1);">
                <input type="text" id="ai-input" placeholder="Ask for ideas, analysis..." style="flex: 1; background: none; border: none; padding: 10px 15px; color: white; font-size: 14px; outline: none;">
                <button id="ai-send-btn" style="background: #3b82f6; border: none; color: white; width: 40px; height: 40px; border-radius: 12px; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center;">
                    <i class="bi bi-send-fill"></i>
                </button>
            </div>
            <div style="font-size: 9px; color: #475569; text-align: center; margin-top: 10px;">Powered by Gemini AI • Strategy & Insights</div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
    @keyframes slideUp {
        from { opacity: 0; transform: translateY(30px) scale(0.95); }
        to { opacity: 1; transform: translateY(0) scale(1); }
    }
    #ai-messages::-webkit-scrollbar { width: 4px; }
    #ai-messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
    
    .ai-msg-bubble {
        align-self: flex-start;
        background: rgba(255,255,255,0.05);
        color: #e2e8f0;
        padding: 12px 16px;
        border-radius: 18px 18px 18px 4px;
        font-size: 14px;
        max-width: 90%;
        border: 1px solid rgba(255,255,255,0.08);
        line-height: 1.5;
    }
    
    .user-msg-bubble {
        align-self: flex-end;
        background: linear-gradient(135deg, #3b82f6, #2563eb);
        color: white;
        padding: 12px 16px;
        border-radius: 18px 18px 4px 18px;
        font-size: 14px;
        max-width: 85%;
        box-shadow: 0 4px 15px rgba(59, 130, 246, 0.2);
    }

    .typing-indicator {
        font-size: 12px;
        color: #64748b;
        margin-left: 5px;
        font-style: italic;
    }
</style>

<script>
    (function() {
        const toggleBtn = document.getElementById('ai-toggle-btn');
        const closeBtn = document.getElementById('ai-close-btn');
        const chatWindow = document.getElementById('ai-chat-window');
        const sendBtn = document.getElementById('ai-send-btn');
        const inputField = document.getElementById('ai-input');
        const messagesContainer = document.getElementById('ai-messages');

        toggleBtn.addEventListener('click', () => {
            chatWindow.style.display = chatWindow.style.display === 'none' ? 'flex' : 'none';
            if(chatWindow.style.display === 'flex') inputField.focus();
        });

        closeBtn.addEventListener('click', () => {
            chatWindow.style.display = 'none';
        });

        function addMessage(content, isUser = false) {
            const msgDiv = document.createElement('div');
            msgDiv.className = isUser ? 'user-msg-bubble' : 'ai-msg-bubble';
            
            if (isUser) {
                msgDiv.textContent = content;
            } else {
                msgDiv.innerHTML = marked.parse(content);
            }
            
            messagesContainer.appendChild(msgDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        async function handleSend() {
            const query = inputField.value.trim();
            if (!query) return;

            addMessage(query, true);
            inputField.value = '';

            // Typing indicator
            const typing = document.createElement('div');
            typing.className = 'typing-indicator';
            typing.innerHTML = '<span class="spinner-grow spinner-grow-sm me-1" style="width: 8px; height: 8px;"></span> Gemini is thinking...';
            messagesContainer.appendChild(typing);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;

            try {
                const response = await fetch('/ai/ask', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: query })
                });
                const data = await response.json();
                
                messagesContainer.removeChild(typing);
                addMessage(data.response);
            } catch (err) {
                if(typing.parentNode) messagesContainer.removeChild(typing);
                addMessage("I am currently experiencing connection issues with the Nexus Brain. Please check your API configuration.");
            }
        }

        sendBtn.addEventListener('click', handleSend);
        inputField.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleSend();
        });
    })();
</script>
